name: Deploy API to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: api-entrenatuse
  DOTNET_VERSION: '8.0.x'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ./api/EntrenaTuSer.Api.csproj

      - name: Build
        run: dotnet build ./api/EntrenaTuSer.Api.csproj --configuration Release --no-restore

      - name: Publish (self-contained for Linux)
        run: |
          dotnet publish ./api/EntrenaTuSer.Api.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -o ./publish

      - name: Login to Azure (using existing service principal secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_825F4E0B8BDB4746841FCB6F4C2C0F41 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6DEB3AB0EA4E4EC59602828C4013EEBD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_00296602680D4D4FA51A8BE419628449 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish
          slot-name: production