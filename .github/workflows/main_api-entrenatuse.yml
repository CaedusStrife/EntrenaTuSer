name: Deploy API to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: api-entrenatuse
  AZURE_RESOURCE_GROUP: rg-entrenatuser-prod2
  DOTNET_VERSION: '8.0.x'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ./api/EntrenaTuSer.Api.csproj

      - name: Build
        run: dotnet build ./api/EntrenaTuSer.Api.csproj --configuration Release --no-restore

      - name: Publish (self-contained for Linux)
        run: |
          dotnet publish ./api/EntrenaTuSer.Api.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -o ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          package: ./publish
          slot-name: production