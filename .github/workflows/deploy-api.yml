name: Deploy API to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore api/EntrenaTuSer.Api.csproj

      - name: Build and publish
        run: dotnet publish api/EntrenaTuSer.Api.csproj -c Release -o ./publish --no-restore

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure App Settings (Connection String & JWT Secret)
        uses: azure/appservice-settings@v1
        with:
          app-name: 'api-entrenatuse'
          slot-name: 'production'
          app-settings-json: |
            [
              {
                "name": "ConnectionStrings__EntrenaTuSer",
                "value": "${{ secrets.AZURE_SQL_CONNECTION_STRING }}",
                "slotSetting": false
              },
              {
                "name": "Auth__JwtSecret",
                "value": "${{ secrets.JWT_SECRET }}",
                "slotSetting": false
              }
            ]
          general-settings-json: '{"alwaysOn": true}'

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'api-entrenatuse'
          package: ./publish
          slot-name: 'production'