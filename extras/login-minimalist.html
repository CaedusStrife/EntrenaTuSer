<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Minimalista - Entrena Tu Ser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #faf8f5;
      --water: #e8f4f8;
      --ebru-orange: #8da399;
      --ebru-teal: #007a6f;
      --ink: #2d2a26;          /* Dark enough for contrast */
      --ink-muted: #5a5a5a;    /* Muted dark for contrast */
      --fiber: #e8e4dc;
      --radius-md: 24px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--paper);
      color: var(--ink);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-minimalist {
      width: 100%;
      max-width: 360px;
      padding: 40px 24px;
      background: var(--ebru-paper, #fcfaf7);
      border-radius: var(--radius-md, 24px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      position: relative;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 40px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      display: block;
      color: var(--ebru-orange);
    }

    .brand-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      color: var(--ink);
      margin: 0 0 4px;
      font-weight: 700;
    }

    .brand-promise {
      font-size: 0.875rem;
      color: var(--ink-muted);
      text-align: center;
      margin: 0;
    }

    .login-form {
      background: white;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      color: var(--ink-muted);
      margin-bottom: 8px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--fiber, #e8e3db);
      border-radius: 10px;
      font-size: 1rem;
      color: var(--ink);
      background: var(--paper, #fcfaf7);
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--ebru-orange);
    }

    .btn-primary {
      width: 100%;
      padding: 14px 24px;
      background: var(--ebru-orange, #8da399);
      color: white;
      border: none;
      border-radius: 24px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(141, 163, 153, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(141, 163, 153, 0.4);
    }

    .btn-primary:focus {
      outline: 2px solid white;
      outline-offset: 2px;
    }

    .register-link {
      text-align: center;
      font-size: 0.875rem;
      color: var(--ink-muted);
    }

    .link-register {
      color: var(--ebru-orange, #8da399);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .link-register:hover {
      color: #6b8c7a;
    }

    /* Lucide icons */
    <script src="https://lucide.dev.githubusercontent.com/svgr branch/"></script>
  </style>
</head>

<body>
  <div class="login-minimalist">
    <div class="login-brand">
      <i data-lucide="activity" class="brand-logo" aria-hidden="true"></i>
      <h1 class="brand-title">Entrena tu ser</h1>
      <p class="brand-promise">Tu entrenamiento comienza aquí</p>
    </div>

    <div class="login-form">
      <form id="login-form" class="bowls-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="login-email">Correo Electrónico</label>
          <input class="form-input" type="email" id="login-email" name="email" placeholder="tu@email.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Contraseña</label>
          <input class="form-input" type="password" id="login-password" name="password" placeholder="••••••••" required minlength="8" autocomplete="current-password">
        </div>

        <button type="submit" class="btn-primary">Iniciar Sesión</button>

      </form>
    </div>

    <div class="register-link">
      <p style="margin: 0 0 8px;">¿No tienes cuenta?</p>
      <a href="#" class="link-register">Crear cuenta gratis</a>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
